name: CI
description: CI biome

on:
  push:
    branches:
      - main

jobs:
  biome:
    name: Check all files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run biome ci
        run: npx @biomejs/biome ci --error-on-warnings